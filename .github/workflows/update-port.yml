name: Update joker-registry port

on:
  workflow_call:
    inputs:
      port:
        description: "端口名，对应 registry 的 ports/<port>"
        required: true
        type: string
      tag:
        description: "要发布的 tag；留空时取触发事件的 ref（push tag 场景）"
        required: false
        type: string
        default: ""
      registry:
        description: "registry 仓库，owner/repo"
        required: false
        type: string
        default: "Joker-Principal/joker-registry"
      registry-branch:
        description: "registry 目标分支"
        required: false
        type: string
        default: "master"
      source-branch:
        description: "源仓默认分支；留空则用 API 查 default_branch"
        required: false
        type: string
        default: ""
    secrets:
      registry-token:
        description: "对 registry 有 Contents: Read and write 的 PAT"
        required: true

permissions:
  contents: read

concurrency:
  group: update-port-${{ inputs.port }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout registry
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.registry }}
          ref: ${{ inputs.registry-branch }}
          token: ${{ secrets.registry-token }}
          fetch-depth: 0

      - name: Update port
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/update-port.py \
            --port "${{ inputs.port }}" \
            --tag "${{ inputs.tag }}" \
            --ref-name "${{ github.ref_name }}" \
            --source-repo "${{ github.repository }}" \
            --source-branch "${{ inputs.source-branch }}" \
            --registry-dir . \
            --registry-branch "${{ inputs.registry-branch }}"
